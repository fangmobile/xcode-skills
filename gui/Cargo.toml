[package]
name = "xcode-skills-gui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "=0.9.1"
serde_json = "1"

[dev-dependencies]
gpui-kit = { version = "=0.9.1", features = ["test-support"] }

# Keep framework layers optimized in dev boots; application code stays debuggable.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
